name: Build NardiTune APK
on:
  push:
    paths: ['android-music-player/**', '.github/workflows/android-music-player.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-music-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accetta licenze SDK (l'SDK e' gia' sul runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NardiTune-apk
          path: android-music-player/app/build/outputs/apk/release/*.apk
      - name: Pubblica Release con l'APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk NardiTune.apk
          gh release create "narditune-build-${{ github.run_number }}" NardiTune.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "NardiTune - build ${{ github.run_number }}" \
            --notes "APK installabile (firmato con chiave di debug). Commit ${{ github.sha }}"
